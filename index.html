<!DOCTYPE html>
<html lang="en">
<head>
    <base href="/">

    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description"
          content="Get instant loan approval in just 2 minutes! ScoreLoan is AI based credit marketplace which offers instant loan, personal loan up to 5 Lakh">

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title"
          content="ScoreLoan – Instant Loan, Personal Loan & Credit Marketplace">
    <link rel="apple-touch-icon" href="icons/icon-192.png">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.ico"/>
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">

    <title>ScoreLoan – Instant Loan, Personal Loan & Credit Marketplace</title>
    <link rel="manifest" href="manifest.json">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #ffffff;
        }

        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #ffffff;
            z-index: 99999;
        }

        #lottie-container {
            width: 180px;
            height: 180px;
        }

        #loading-text {
            margin-top: 8px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            color: #666666;
        }
    </style>
</head>

<body>

<!-- Loading Screen -->
<div id="loading">
    <div id="lottie-container"></div>
</div>

<!-- Lottie Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>

<script>
    lottie.loadAnimation({
        container: document.getElementById('lottie-container'),
        renderer: 'svg',
        loop: true,
        autoplay: true,

        path: 'assets/assets/lottie/logo.json'
    });
</script>

<!-- Capture PWA install prompt event -->
<script>
    let deferredPrompt;

    window.addEventListener('beforeinstallprompt', (e) => {
      deferredPrompt = e;
    });

    function promptInstall(){
       deferredPrompt.prompt();
    }

    window.addEventListener('appinstalled', () => {
      deferredPrompt = null;
      appInstalled();
    });

    function getLaunchMode() {
      const isStandalone = window.matchMedia('(display-mode: standalone)').matches;

      if(deferredPrompt) hasPrompt();

      if (document.referrer.startsWith('android-app://')) {
        appLaunchedAsTWA();
      } else if (navigator.standalone || isStandalone) {
        appLaunchedAsPWA();
      } else {
        window.appLaunchedInBrowser();
      }
    }
</script>

<!-- Remove loader when Flutter paints first frame -->
<script>
    window.addEventListener('flutter-first-frame', function () {
        const loader = document.getElementById('loading');
        if (loader) {
            loader.remove();
        }
    });

    async function registerServiceWorker(retryCount = 3, delay = 2000) {
        if ('serviceWorker' in navigator) {
            for (let attempt = 1; attempt <= retryCount; attempt++) {
                try {
                    const registration = await navigator.serviceWorker.register('/firebase-messaging-sw.js');
                    console.log(`✅ Service Worker registered (Attempt ${attempt}):`, registration);
                    await navigator.serviceWorker.ready;
                    console.log('✅ Service Worker is ready');
                    return;
                } catch (error) {
                    console.error(`❌ Service Worker registration failed (Attempt ${attempt}):`, error);
                    if (attempt < retryCount) {
                        console.log(`🔄 Retrying in ${delay}ms...`);
                        await new Promise(res => setTimeout(res, delay));
                    }
                }
            }
            console.error('🚨 Service Worker registration failed after all attempts.');
        }
    }

    window.addEventListener('load', async function () {
        await registerServiceWorker();
        console.log("🚀 Starting Flutter...");
    });
</script>

<script src="flutter_bootstrap.js" async></script>

</body>
</html>
