        <g id="coin-leaning" filter="url(#coinShadow)" transform="translate(0,-5)">
            <ellipse cx="502" cy="492" rx="38" ry="38" fill="url(#coinSide)" />
            <ellipse cx="498" cy="490" rx="38" ry="38" fill="url(#coinGold)" />
            <ellipse cx="498" cy="490" rx="28" ry="28" fill="none" stroke="#ffa000" stroke-width="3" opacity="0.4" />
            <path d="M 490,475 C 505,470 515,490 500,505" fill="none" stroke="#e65100" stroke-width="2" opacity="0.3" stroke-linecap="round" />
