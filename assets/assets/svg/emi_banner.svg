            <rect x="300" y="90" width="260" height="360" rx="12" fill="url(#docGrad)" />

            <text x="430" y="150" font-family="'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="bold" fill="#2c5c70" text-anchor="middle" letter-spacing="3">LOAN</text>

            <g fill="#b2d4df" opacity="0.6">
                <rect x="330" y="185" width="200" height="5" rx="2.5" />
                <rect x="330" y="205" width="200" height="5" rx="2.5" />
                <rect x="330" y="225" width="160" height="5" rx="2.5" />
                <rect x="330" y="260" width="200" height="5" rx="2.5" />
                <rect x="330" y="280" width="200" height="5" rx="2.5" />
                <rect x="330" y="315" width="200" height="5" rx="2.5" />
                <rect x="330" y="335" width="130" height="5" rx="2.5" />

                <rect x="330" y="370" width="200" height="5" rx="2.5" />
                <rect x="330" y="390" width="180" height="5" rx="2.5" />
