            <ellipse cx="578" cy="459" rx="40" ry="14" fill="url(#coinGold)" />

            <rect x="538" y="441" width="80" height="15" fill="url(#coinSide)" />
            <ellipse cx="578" cy="441" rx="40" ry="14" fill="url(#coinGold)" />

            <rect x="538" y="423" width="80" height="15" fill="url(#coinSide)" />
            <ellipse cx="578" cy="423" rx="40" ry="14" fill="url(#coinGold)" />

            <rect x="538" y="405" width="80" height="15" fill="url(#coinSide)" />
            <ellipse cx="578" cy="405" rx="40" ry="14" fill="url(#coinGold)" />

            <rect x="538" y="387" width="80" height="15" fill="url(#coinSide)" />
            <ellipse cx="578" cy="387" rx="40" ry="14" fill="url(#coinGold)" />

            <rect x="538" y="369" width="80" height="15" fill="url(#coinSide)" />
