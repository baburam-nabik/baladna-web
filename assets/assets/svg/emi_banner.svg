                <rect x="88" y="26" width="36" height="22" rx="5" fill="url(#btnNum)" />
                <rect x="132" y="26" width="36" height="22" rx="5" fill="url(#btnEq)" />

                <rect x="0" y="56" width="36" height="22" rx="5" fill="url(#btnNum)" />
                <rect x="44" y="56" width="36" height="22" rx="5" fill="url(#btnNum)" />
                <rect x="88" y="56" width="36" height="22" rx="5" fill="url(#btnNum)" />
                <rect x="132" y="56" width="36" height="22" rx="5" fill="url(#btnEq)" />

