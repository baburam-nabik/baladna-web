                <rect x="44" y="0" width="36" height="18" rx="4" fill="url(#btnFunc)" />
                <rect x="88" y="0" width="36" height="18" rx="4" fill="url(#btnFunc)" />
                <rect x="132" y="0" width="36" height="18" rx="4" fill="url(#btnFunc)" />

                <rect x="0" y="26" width="36" height="22" rx="5" fill="url(#btnNum)" />
