<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="transparent" />
            <stop offset="100%" stop-color="transparent" />
        </linearGradient>

        <linearGradient id="boardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1a5f7a" />
            <stop offset="100%" stop-color="#0d3848" />
        </linearGradient>
        <linearGradient id="docGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="100%" stop-color="#f0f7f4" />
        </linearGradient>

        <linearGradient id="calcBody" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1f4e5b" />
            <stop offset="100%" stop-color="#0f2b35" />
        </linearGradient>
        <linearGradient id="calcScreen" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#e6f4f8" />
            <stop offset="100%" stop-color="#cfe7ee" />
        </linearGradient>
        <linearGradient id="btnFunc" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#76c8a3" />
            <stop offset="100%" stop-color="#52ab83" />
        </linearGradient>
        <linearGradient id="btnNum" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#eef5f6" />
            <stop offset="100%" stop-color="#cbdbe0" />
        </linearGradient>
        <linearGradient id="btnEq" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#dae7eb" />
            <stop offset="100%" stop-color="#b0c4cc" />
        </linearGradient>

        <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3fa881" />
            <stop offset="40%" stop-color="#2a8e67" />
            <stop offset="100%" stop-color="#15573c" />
        </linearGradient>
        <linearGradient id="bagHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#6edcb3" stop-opacity="0.4" />
            <stop offset="100%" stop-color="#6edcb3" stop-opacity="0" />
        </linearGradient>

        <linearGradient id="coinGold" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#ffd54f" />
            <stop offset="40%" stop-color="#ffb300" />
            <stop offset="100%" stop-color="#ff8f00" />
        </linearGradient>
        <linearGradient id="coinSide" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffa000" />
            <stop offset="100%" stop-color="#e65100" />
        </linearGradient>

        <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#9ccc65" />
            <stop offset="100%" stop-color="#689f38" />
        </linearGradient>

        <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0b3023" flood-opacity="0.12" />
        </filter>
        <filter id="coinShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.15" />
        </filter>
    </defs>

    <rect width="100%" height="100%" fill="url(#bgGrad)" />

    <g transform="translate(0, 20)">
        <g class="leaves-left" fill="url(#leafGrad)" opacity="0.8">
            <path d="M 120,440 C 90,420 80,380 100,350 C 110,380 130,410 120,440 Z" />
            <path d="M 135,465 C 100,460 90,430 100,400 C 115,425 135,445 135,465 Z" />
            <path d="M 155,490 C 120,510 95,485 110,455 C 125,475 145,485 155,490 Z" />
            <path d="M 175,510 C 140,540 120,515 130,485 C 145,505 165,510 175,510 Z" />
            <path d="M 105,405 Q 140,460 190,520" fill="none" stroke="#689f38" stroke-width="3" stroke-linecap="round" />
        </g>

        <g class="leaves-right-back" fill="url(#leafGrad)" opacity="0.7">
            <path d="M 590,290 C 570,260 580,220 610,200 C 615,230 610,265 590,290 Z" />
            <path d="M 615,295 C 600,265 615,235 640,220 C 640,250 630,280 615,295 Z" />
            <path d="M 585,320 C 560,300 555,270 575,250 C 585,270 590,300 585,320 Z" />
