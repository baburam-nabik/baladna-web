            <path d="M 590,295 C 550,300 500,340 500,410 C 500,490 550,520 630,520 C 710,520 760,490 760,410 C 760,340 710,300 670,295 Z" fill="url(#bagGrad)" />
            <path d="M 505,410 C 505,480 550,512 630,512 C 710,512 750,480 750,410 C 750,346 705,304 668,299 C 705,315 740,355 740,410 C 740,475 700,502 630,502 C 560,502 520,475 520,410 C 520,355 555,315 592,299 C 555,304 505,346 505,410 Z" fill="#114630" opacity="0.3" />

            <path d="M 530,390 C 520,340 560,310 600,305 C 560,315 540,350 545,400 C 550,440 570,470 610,485 C 570,475 540,440 530,390 Z" fill="url(#bagHighlight)" />

            <path d="M 570,292 C 590,285 650,285 670,292 C 675,297 670,305 650,302 C 610,296 590,302 570,297 C 565,295 565,292 570,292 Z" fill="#9ccc65" />
